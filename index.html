<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Nebula - 流体星云交互</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 视频源：隐藏，仅供 AI 读取 -->
    <video id="video" autoplay playsinline></video>
    
    <!-- 视觉输出画布 -->
    <canvas id="glCanvas"></canvas>

    <!-- 1. 开始界面 (Intro) -->
    <div id="intro">
        <div class="intro-content">
            <h1>FLUID NEBULA <span>流体星云</span></h1>
            <p class="subtitle">视听通感 · 掌控液态宇宙</p>
            
            <div class="gesture-list">
                <div class="gesture-item">
                    <span class="icon">☝️</span>
                    <div class="text">
                        <strong>伸出食指滑动</strong>
                        <p>👁️ 视觉：指尖化作搅拌棒，搅动流体形成发光漩涡</p>
                        <p>🎵 听觉：控制特雷门琴音高，上下移动改变旋律</p>
                    </div>
                </div>
                <div class="gesture-item">
                    <span class="icon">🖐️</span>
                    <div class="text">
                        <strong>张开五指</strong>
                        <p>👁️ 视觉：流体瞬间向四周炸开，色彩从冷转暖，星云绽放</p>
                        <p>🎵 听觉：滤波器打开，音乐变得空灵、明亮、宽广</p>
                    </div>
                </div>
                <div class="gesture-item">
                    <span class="icon">✊</span>
                    <div class="text">
                        <strong>握紧拳头</strong>
                        <p>👁️ 视觉：流体瞬间冻结收缩，空间变暗并出现撕裂故障</p>
                        <p>🎵 听觉：触发深沉的 Bass Drop（重低音下潜）轰鸣</p>
                    </div>
                </div>
            </div>

            <button id="startBtn">启动引擎 (需允许摄像头/音频)</button>
            <p class="hint">点击后请允许浏览器访问摄像头和声音，建议在光线充足处体验</p>
        </div>
    </div>

    <!-- 2. 状态提示 -->
    <div id="loading" class="hidden">正在加载视觉与音频引擎...</div>
    <div class="hud">
        <span id="status-text">等待手势...</span>
    </div>

    <!-- 引入 MediaPipe 旧版稳定库 (无需下载模型文件，CDN秒开) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- 引入你的核心逻辑 -->
    <script src="script.js"></script>

</body>
</html>
